name: pages
# Publishes site/ to GitHub Pages.
#
# **The screenshots are rendered here, not committed.** `scripts/build_site.sh`
# runs `beam --screenshot` on a macOS runner, so every image on the marketing
# page is a render of the app at that commit. A committed PNG can quietly stop
# being what the product looks like; a generated one cannot — the same argument
# PLAN.md §5.2 makes for keeping `--dump-scene` and `--screenshot` in sync with
# every layout change, applied to the page that advertises the result.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Render the site's screenshots from the app
        run: scripts/build_site.sh
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
